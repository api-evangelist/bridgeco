name: Bridgeco
description: 'BridgeCo Inc. was a fabless semiconductor company founded in 2000 that
  built networked-audio silicon and software for consumer electronics. Its JukeBlox
  platform — a system-on-a-chip paired with a software development kit — let wireless
  speakers, A/V receivers, home-theater systems and docking stations stream music from
  tablets, smartphones and PCs, and was designed into products from Pioneer, Philips,
  Denon, Marantz, JBL and Harman/Kardon. Earlybird Venture Capital was the company''s
  first institutional investor in 2000. BridgeCo was acquired by Standard Microsystems
  Corporation (SMSC) on 19 May 2011 in a deal worth up to $67.5 million, and SMSC was
  in turn acquired by Microchip Technology on 2 August 2012, where the JukeBlox wireless-audio
  line was folded into Microchip''s portfolio. BridgeCo no longer operates as an independent
  company and publishes no developer portal, documentation or public API; the bridgeco.com
  domain today is an unrelated domain-for-sale parking page.'
